name: Nova-Polaris CI

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  python:
    name: Python lint + Task 2 suite (no AWS credentials)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff + compile check)
        run: |
          ruff check src/ config.py || true
          python -m py_compile src/agent_orchestrator.py config.py
      - name: Task 2 multi-agent suite
        run: python tests/test_agent.py task2

  frontend:
    name: Console production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install and build
        run: |
          npm ci
          npm run build

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (backend disabled, providers only)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
